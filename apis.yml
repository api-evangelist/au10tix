name: AU10TIX
kind: company
description: AU10TIX is an identity verification and document authentication provider
  delivering KYC, document analysis, biometric face comparison, liveness, and fraud
  detection through a single REST API (the Back Office Server, "BOS") and web/mobile
  SDKs. The platform orchestrates verification workflows/sessions, returns structured
  results, and notifies clients via webhooks.
