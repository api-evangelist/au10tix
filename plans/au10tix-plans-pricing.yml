description: >-
  AU10TIX pricing is sales-led and not publicly published. Plans are quoted per
  customer based on verification volume, the mix of products consumed (document
  authentication, identity verification, face comparison / liveness, AML &
  sanctions screening, serial fraud monitoring, business verification), region,
  and contract term. Engagements are typically annual contracts with
  per-verification (per-transaction) usage pricing and volume commitments.
  Specific list prices, per-check rates, and free-tier details are not disclosed
  publicly and are therefore not reconciled in this artifact.
notes: >-
  No public pricing page exists; figures must be obtained from AU10TIX sales.
  Verify per-product per-transaction rates, minimum commitments, and any
  trial/sandbox terms directly with AU10TIX during reconciliation.
sources:
- https://www.au10tix.com/products/platform/
- https://www.au10tix.com/how-to-get-verified-with-au10tix/
- https://www.au10tix.com/company/contact-us/
